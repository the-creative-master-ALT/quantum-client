<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Quantum Launcher — every Eaglercraft build, one file.">
<title>Quantum Launcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d1420'/><path d='M6 21l10-12 10 12z' fill='%234ade80'/><path d='M6 21h20v5H6z' fill='%236b4a2f'/></svg>">
<style>
/* ============================== tokens ============================== */
:root{
  --bg:#080c14; --panel:#0e1420; --panel-2:#131b2a; --line:#1e2a3d;
  --text:#e8eef8; --dim:#8b9bb4; --accent:#4ade80;
  --shadow:0 18px 50px -12px rgba(0,0,0,.75);
  --r:14px; --sidebar:264px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="light"]{
  --bg:#eef2f8; --panel:#fff; --panel-2:#f4f7fc; --line:#d8e0ec;
  --text:#111a2b; --dim:#5b6b85; --shadow:0 18px 44px -16px rgba(20,32,60,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================== shell ============================== */
/* The same layout at every size: on a smaller screen the whole thing scales
   down instead of reflowing. --s is set from JS as
       min(1, width/1400, height/860)
   and the grid is drawn 1/--s times too big, so after scaling it lands
   exactly on the viewport. transform-origin 0 0 keeps it pinned top-left. */
.shell{
  --s:1;
  display:grid;
  width:calc(100vw / var(--s));
  height:calc(100dvh / var(--s));
  transform:scale(var(--s));
  transform-origin:0 0;
  grid-template-columns:var(--sidebar) 1fr;
  grid-template-rows:1fr auto;
  grid-template-areas:"side stage" "dock dock";
}

/* ============================== sidebar ============================== */
.side{
  grid-area:side; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
.brand{padding:18px 16px 12px; border-bottom:1px solid var(--line)}
.brand h1{
  margin:0; font-size:15px; font-weight:800; letter-spacing:.2px;
  display:flex; align-items:center; gap:9px;
}
.brand .dot{
  width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent); transition:background .25s,box-shadow .25s;
}
.brand p{margin:5px 0 0; font-size:11px; color:var(--dim); letter-spacing:.3px}

.nav{flex:1; overflow-y:auto; padding:10px 10px 4px; min-height:0}
.nav h2{
  margin:12px 8px 6px; font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--dim); font-weight:700;
}
.g{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 10px; border-radius:10px; margin-bottom:2px;
  color:var(--dim); transition:background .16s,color .16s;
  position:relative;
}
.g:hover{background:var(--panel-2); color:var(--text)}
.g[aria-current="true"]{background:var(--panel-2); color:var(--text); font-weight:600}
.g[aria-current="true"]::before{
  content:""; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
  width:3px; height:20px; border-radius:0 3px 3px 0; background:var(--g-accent,var(--accent));
}
.g .swatch{
  width:22px;height:22px;border-radius:6px;flex:none;
  background:var(--g-accent,var(--accent)); opacity:.85;
  display:grid;place-items:center;
}
.g .swatch svg{width:13px;height:13px;fill:#08101c}
.g .lbl{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .n{font-size:10.5px;color:var(--dim);font-family:var(--mono);flex:none}
.g.tiny{padding:6px 10px;font-size:11.5px}
.g[hidden]{display:none}

/* pinned footer inside the sidebar: Downloads lives here, not in the dock */
.side-foot{padding:10px; border-top:1px solid var(--line); flex:none}
.dl-side{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:10px 11px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel-2);
  color:var(--text); font-size:12.5px; font-weight:600;
  transition:border-color .15s,color .15s,background .15s;
}
.dl-side:hover{border-color:var(--accent); color:var(--accent)}
.dl-side svg{width:15px;height:15px;fill:currentColor;flex:none}
.dl-side .lbl{flex:1;text-align:left}
.dl-side .n{font-size:10.5px;color:var(--dim);font-family:var(--mono)}

/* ============================== stage ============================== */
.stage{
  grid-area:stage; min-width:0; min-height:0; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:26px 26px 18px; gap:18px; position:relative;
}
.stage::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(90% 70% at 50% 30%, color-mix(in srgb,var(--accent) 12%, transparent), transparent 70%);
  transition:background .4s;
}
.art-wrap{
  position:relative; width:min(100%,920px); aspect-ratio:16/9;
  border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow);
  border:1px solid var(--line); background:var(--panel-2); flex:none;
  z-index:1;
}
.art{display:block;width:100%;height:100%}
.art-wrap .picker{
  position:absolute; top:12px; right:12px; display:flex; gap:6px;
  opacity:0; transition:opacity .2s;
}
.art-wrap:hover .picker,.art-wrap:focus-within .picker{opacity:1}
.pick{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:rgba(8,12,20,.72); color:#fff; backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14); transition:background .15s,transform .15s;
}
.pick:hover{background:rgba(8,12,20,.92); transform:scale(1.08)}
.pick svg{width:15px;height:15px;fill:currentColor}

/* build card under the art */
.picked{
  width:min(100%,920px); background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); padding:14px 16px; display:flex; align-items:center;
  gap:14px; flex-wrap:wrap; z-index:1;
}
.picked .who{flex:1;min-width:220px}
.picked .name{margin:0;font-size:17px;font-weight:700;letter-spacing:.1px}
.picked .sub{margin:4px 0 0;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{
  font-size:10px; letter-spacing:.5px; text-transform:uppercase; font-weight:700;
  padding:3px 8px; border-radius:999px; background:var(--panel-2);
  border:1px solid var(--line); color:var(--dim);
}
.chip.on{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%, transparent)}
.play{
  display:inline-flex;align-items:center;gap:9px; padding:12px 22px; border-radius:11px;
  background:var(--accent); color:#06121f; font-weight:800; font-size:13.5px;
  letter-spacing:.3px; transition:transform .14s,filter .14s,background .25s;
  box-shadow:0 8px 24px -8px color-mix(in srgb,var(--accent) 70%, transparent);
}
.play:hover{transform:translateY(-1px); filter:brightness(1.08)}
.play svg{width:15px;height:15px;fill:currentColor}
.icon-btn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line); background:var(--panel-2); color:var(--dim);
  transition:color .15s,border-color .15s,background .15s;
}
.icon-btn:hover{color:var(--text); border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
.icon-btn[aria-pressed="true"]{color:var(--accent); border-color:var(--accent)}
.icon-btn svg{width:17px;height:17px;fill:currentColor}

/* ============================== dock ============================== */
.dock{
  grid-area:dock; background:var(--panel); border-top:1px solid var(--line);
  padding:11px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.dock .sel-wrap{position:relative; flex:1; min-width:200px; max-width:520px}
.dock select{
  width:100%; appearance:none; padding:10px 34px 10px 13px; border-radius:10px;
  background:var(--panel-2); border:1px solid var(--line); font-size:13px;
  cursor:pointer; overflow:hidden; text-overflow:ellipsis;
}
.dock .caret{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  pointer-events:none; width:13px; height:13px; fill:var(--dim);
}
.step{display:flex;gap:4px}
.count{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.spacer{flex:1}

/* ============================== downloads ============================== */
.scrim{
  position:fixed; inset:0; background:rgba(4,8,14,.72); backdrop-filter:blur(3px);
  z-index:40; display:grid; place-items:center; padding:22px;
}
.scrim[hidden]{display:none}
.sheet{
  width:min(900px,100%); max-height:min(82dvh,760px); display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden;
}
.sheet header{
  padding:16px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px;
}
.sheet header h2{margin:0;font-size:15px;font-weight:800}
.sheet header p{margin:3px 0 0;font-size:11.5px;color:var(--dim)}
.sheet .tools{padding:12px 18px; border-bottom:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap}
.sheet .tools input{
  flex:1; min-width:180px; padding:9px 12px; border-radius:9px;
  background:var(--panel-2); border:1px solid var(--line); font-size:13px;
}
.dl-list{overflow-y:auto; padding:8px 10px 12px; flex:1; min-height:0}
.dl-row{
  display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:10px;
  transition:background .14s;
}
.dl-row:hover{background:var(--panel-2)}
.dl-row .who{flex:1;min-width:0}
.dl-row .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-row .mt{font-size:10.5px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.dl-row .sz{font-size:11px;color:var(--dim);font-family:var(--mono);flex:none}
.dl-btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--line);font-size:11.5px;font-weight:700;
  text-decoration:none;color:var(--text);transition:border-color .15s,color .15s;flex:none;
}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
.dl-btn svg{width:13px;height:13px;fill:currentColor}
.empty{padding:36px 18px;text-align:center;color:var(--dim);font-size:13px}

/* ============================== responsive ==============================
   Deliberately no layout breakpoints: the sidebar stays a sidebar and the
   dock stays a dock at every size. --s (see .shell) does the shrinking, so
   a narrow window gets the identical layout, just smaller. */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

     picker reads alphabetically within each group */
  var BUILDS = VAULT.versions.slice().sort(function (a, b) {
    return String(a.name || "").localeCompare(String(b.name || ""), undefined, { numeric: true });
  });

  /* ---------------- groups ---------------- */
  var GROUPS = [
    { id: "all",         label: "All builds",      scene: "scene-all",        accent: "#7cc7ff" },
    { id: "preclassic",  label: "Pre-Classic",     scene: "scene-preclassic", accent: "#8fae7f" },
    { id: "classic",     label: "Classic",         scene: "scene-classic",    accent: "#5cc95c" },
    { id: "devs",        label: "Devs",            scene: "scene-devs",       accent: "#d99a4e" },
    { id: "alpha",       label: "Alpha",           scene: "scene-alpha",      accent: "#e0873f" },
    { id: "beta",        label: "Beta",            scene: "scene-beta",       accent: "#f0c05a" },
    { id: "early",       label: "Early Releases",  scene: "scene-early",      accent: "#6fb4e8" },
    { id: "mid",         label: "Middle Releases", scene: "scene-mid",        accent: "#a884dd" },
    { id: "modern",      label: "Modern Releases", scene: "scene-modern",     accent: "#3fd8b0" },
    { id: "clients",     label: "Clients",         scene: "scene-clients",    accent: "#ff5fd2" },
    { id: "extras",      label: "Extras",          scene: "scene-extras",     accent: "#5fbfae" }
  ];
  var GMAP = {};
  GROUPS.forEach(function (g) { GMAP[g.id] = g; });

  function groupOf(b) {
    var c = b.category;
    if (c === "preclassic") return "preclassic";
    if (c === "classic") return "classic";
    if (c === "indev" || c === "infdev") return "devs";
    if (c === "alpha") return "alpha";
    if (c === "beta") return "beta";
    if (c === "client") return "clients";
    if (c === "extras") return "extras";
    if (c === "release") {
      var m = String(b.version || "").match(/^(\d+)\.(\d+)/);
      if (m) {
        var maj = +m[1], min = +m[2];
        if (maj === 1 && min <= 8) return "early";
        if (maj === 1 && min >= 9 && min <= 17) return "mid";
        return "modern";
      }
      return "modern";
    }
    return "extras";
  }

  var BY = { all: BUILDS.slice() };
  GROUPS.forEach(function (g) { if (g.id !== "all") BY[g.id] = []; });
  BUILDS.forEach(function (b) { BY[groupOf(b)].push(b); });

  /* ---------------- state ---------------- */
  var LS = "quantum-launcher-v1";
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { saved = {}; }
  var favs = new Set(saved.favs || []);
  var recent = saved.recent || [];
  var state = { group: "all", id: null, dlScope: false, q: "" };

  function persist() {
    try {
      localStorage.setItem(LS, JSON.stringify({ favs: Array.from(favs), recent: recent.slice(0, 12) }));
    } catch (e) {}
  }

  /* ---------------- elements ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  var nav = $("nav"), pick = $("pick"), artUse = $("artUse"), artTitle = $("artTitle");

  /* ---------------- sidebar ---------------- */
  function buildNav() {
    var html = '<h2>Library</h2>';
    GROUPS.forEach(function (g) {
      if (g.id !== "all" && !BY[g.id].length) return;
      html += '<button class="g" data-group="' + g.id + '" style="--g-accent:' + g.accent + '" aria-current="false">' +
              '<span class="swatch"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></span>' +
              '<span class="lbl">' + g.label + '</span>' +
              '<span class="n">' + BY[g.id].length + '</span></button>';
    });

    if (favs.size) {
      html += '<h2>Favourites</h2><button class="g tiny" id="gFav" data-group="__fav" style="--g-accent:#f0c05a" aria-current="false">' +
              '<span class="swatch"><svg viewBox="0 0 24 24"><path d="M12 17.3l-6.2 3.7 1.7-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.5 4.8 1.7 7z"/></svg></span>' +
              '<span class="lbl">Starred</span><span class="n">' + favs.size + '</span></button>';
    }
    if (recent.length) {
      html += '<h2>Continue</h2><button class="g tiny" id="gRecent" data-group="__recent" style="--g-accent:#7cc7ff" aria-current="false">' +
              '<span class="swatch"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v5.6l4 2.3-1 1.7-5-2.9V7z"/></svg></span>' +
              '<span class="lbl">Played recently</span><span class="n">' + recent.length + '</span></button>';
    }
    nav.innerHTML = html;
    nav.querySelectorAll("[data-group]").forEach(function (el) {
      el.addEventListener("click", function () { setGroup(el.getAttribute("data-group")); });
    });
  }

  function listFor(gid) {
    if (gid === "__fav") return BUILDS.filter(function (b) { return favs.has(b.id); });
    if (gid === "__recent") return recent.map(function (id) {
      return BUILDS.filter(function (b) { return b.id === id; })[0];
    }).filter(Boolean);
    return BY[gid] || [];
  }

  /* ---------------- render ---------------- */
  function setGroup(gid, keepBuild) {
    state.group = gid;
    var g = GMAP[gid] || { id: gid, label: gid === "__fav" ? "Starred" : "Played recently", scene: "scene-all", accent: "#7cc7ff" };
    document.documentElement.style.setProperty("--accent", g.accent);
    artUse.setAttribute("href", "#" + g.scene);
    artTitle.textContent = g.label + " artwork";

    nav.querySelectorAll("[data-group]").forEach(function (el) {
      el.setAttribute("aria-current", String(el.getAttribute("data-group") === gid));
    });

    fillPicker(listFor(gid), keepBuild);
  }

  function fillPicker(list, keepBuild) {
    if (!list.length) {
      pick.innerHTML = '<option value="">Nothing here yet</option>';
      $("pos").textContent = "0 / 0";
      showBuild(null);
      return;
    }
    if (keepBuild && list.some(function (b) { return b.id === state.id; })) {
      /* keep selection */
    } else {
      state.id = list[0].id;
    }
    pick.innerHTML = list.map(function (b) {
      return '<option value="' + b.id + '">' + esc(b.name) + " — " + b.sizeText + "</option>";
    }).join("");
    pick.value = state.id;
    showBuild(byId(state.id));
  }

  function byId(id) {
    for (var i = 0; i < BUILDS.length; i++) if (BUILDS[i].id === id) return BUILDS[i];
    return null;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function showBuild(b) {
    if (!b) {
      $("bName").textContent = "Nothing selected";
      $("bSub").textContent = "Pick a group on the left";
      $("bChips").innerHTML = "";
      $("pos").textContent = "—";
      return;
    }
    $("bName").textContent = b.name;
    var bits = [];
    if (b.version) bits.push("v" + b.version);
    if (b.runtime) bits.push(b.runtime);
    if (b.type) bits.push(b.type);
    bits.push(b.sizeText);
    $("bSub").textContent = bits.join("  ·  ");

    var chips = ['<span class="chip on">' + esc(GMAP[groupOf(b)] ? GMAP[groupOf(b)].label : b.category) + "</span>"];
    (b.tags || []).forEach(function (t) { chips.push('<span class="chip">' + esc(t) + "</span>"); });
    $("bChips").innerHTML = chips.join("");

    var f = favs.has(b.id);
    var favBtn = $("fav");
    favBtn.setAttribute("aria-pressed", String(f));
    favBtn.style.color = f ? "var(--accent)" : "";
    favBtn.style.borderColor = f ? "var(--accent)" : "";

    var list = listFor(state.group);
    var i = list.findIndex(function (x) { return x.id === b.id; });
    $("pos").textContent = i >= 0 ? (i + 1) + " / " + list.length : list.length + " builds";
  }

  /* ---------------- actions ---------------- */
  function launch(b) {
    if (!b) return;
    recent = [b.id].concat(recent.filter(function (x) { return x !== b.id; })).slice(0, 12);
    persist();
    buildNav();
    setGroup(state.group, true);
    window.location.href = b.url;
  }

  $("play").addEventListener("click", function () { launch(byId(state.id)); });
  pick.addEventListener("change", function () { state.id = pick.value; showBuild(byId(state.id)); });
  $("prev").addEventListener("click", function () { step(-1); });
  $("next").addEventListener("click", function () { step(1); });
  $("shuffle").addEventListener("click", function () {
    var list = listFor(state.group);
    if (!list.length) return;
    state.id = list[Math.floor(Math.random() * list.length)].id;
    pick.value = state.id; showBuild(byId(state.id));
  });

  function step(d) {
    var list = listFor(state.group);
    if (!list.length) return;
    var i = list.findIndex(function (b) { return b.id === state.id; });
    i = (i + d + list.length) % list.length;
    state.id = list[i].id; pick.value = state.id; showBuild(list[i]);
  }

  $("fav").addEventListener("click", function () {
    var b = byId(state.id); if (!b) return;
    if (favs.has(b.id)) favs.delete(b.id); else favs.add(b.id);
    persist(); buildNav(); setGroup(state.group, true);
  });

  $("theme").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(LS + "-theme", next); } catch (e) {}
  });
  try {
    var t = localStorage.getItem(LS + "-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}

  /* ---------------- downloads ---------------- */
  var dlScrim = $("dlScrim"), dlList = $("dlList"), dlSearch = $("dlSearch");

  function renderDl() {
    var q = state.q.trim().toLowerCase();
    var src = state.dlScope ? listFor(state.group) : BUILDS;
    var rows = src.filter(function (b) { return !q || b.name.toLowerCase().indexOf(q) >= 0 || (b.file || "").toLowerCase().indexOf(q) >= 0; });
    $("dlSub").textContent = rows.length + " of " + BUILDS.length + " builds · " + VAULT.totalSizeText + " total";
    if (!rows.length) { dlList.innerHTML = '<div class="empty">Nothing matches “' + esc(state.q) + '”.</div>'; return; }
    dlList.innerHTML = rows.map(function (b) {
      return '<div class="dl-row"><div class="who"><div class="nm">' + esc(b.name) + '</div>' +
             '<div class="mt">' + esc(b.file) + '</div></div>' +
             '<span class="sz">' + b.sizeText + "</span>" +
             '<a class="dl-btn" href="' + b.url + '" download="' + esc(b.file) + '">' +
             '<svg viewBox="0 0 24 24"><path d="M12 16l-5-5 1.4-1.4L11 12.2V4h2v8.2l2.6-2.6L17 11zM5 18h14v2H5z"/></svg>Download</a></div>';
    }).join("");
  }

  $("dlOpen").addEventListener("click", function () { dlScrim.hidden = false; renderDl(); dlSearch.focus(); });
  $("dlClose").addEventListener("click", function () { dlScrim.hidden = true; });
  dlScrim.addEventListener("click", function (e) { if (e.target === dlScrim) dlScrim.hidden = true; });
  dlSearch.addEventListener("input", function () { state.q = dlSearch.value; renderDl(); });
  $("dlGroup").addEventListener("click", function () {
    state.dlScope = !state.dlScope;
    this.style.borderColor = state.dlScope ? "var(--accent)" : "";
    this.style.color = state.dlScope ? "var(--accent)" : "";
    renderDl();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !dlScrim.hidden) { dlScrim.hidden = true; return; }
    if (!dlScrim.hidden) return;
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); step(1); }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    if (e.key === "Enter") { e.preventDefault(); launch(byId(state.id)); }
    if (e.key === "/") { e.preventDefault(); $("dlOpen").click(); }
  });

  /* ---------------- fit to viewport ----------------
     The layout never reflows to a topbar: a smaller window scales the whole
     shell down instead, so the sidebar stays a sidebar and the dock stays a
     dock. 1400x860 is the size the layout was drawn for; anything larger
     renders 1:1. The floor keeps it from shrinking into illegibility. */
  var shell = document.querySelector(".shell");
  function fit() {
    var s = Math.min(1, window.innerWidth / 1400, window.innerHeight / 860);
    shell.style.setProperty("--s", Math.max(0.4, s).toFixed(4));
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  /* ---------------- boot ---------------- */
  $("brandSub").textContent = VAULT.count + " builds · " + VAULT.totalSizeText;
  $("dlCount").textContent = VAULT.count;
  dlSearch.placeholder = "Search " + VAULT.count + " builds…";
  buildNav();

  var hash = (location.hash || "").replace(/^#\/?/, "");
  var start = hash && byId(hash);
  if (start) {
    setGroup(groupOf(start));
    state.id = start.id; pick.value = start.id; showBuild(start);
  } else {
    setGroup("all");
    if (recent.length && byId(recent[0])) { state.id = recent[0]; pick.value = state.id; showBuild(byId(state.id)); }
  }
})();
</script>
</body>
</html>
